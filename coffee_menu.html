.badge.puzzle { background: #fef3c7; color: #92400e; }
.badge.dog { background: #fee2e2; color: #991b1b; }
table { width: 100%; border-collapse: collapse; }
th { font-size: 11px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; padding: 8px 10px; text-align: right; border-bottom: 2px solid #e5e7eb; font-weight: 600; white-space: nowrap; }
td { padding: 9px 10px; font-size: 13px; border-bottom: 1px solid #f3f4f6; color: #374151; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #f9fafb; }
tr.flash td { animation: flash 1.2s; }
@keyframes flash { 0% { background: #fef3c7; } 100% { background: transparent; } }
.price-input { width: 80px; padding: 4px 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; text-align: center; color: #1f2937; background: #fff; font-weight: 600; }

.price-input.changed { border-color: #d97706; background: #fffbeb; }
.fc-pct { font-weight: 700; font-size: 13px; }
.fc-low { color: #059669; }
.fc-mid { color: #d97706; }
.fc-high { color: #dc2626; }
.tip { background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 10px 16px; margin-bottom: 16px; font-size: 12px; color: #92400e; }
.reset-btn { padding: 6px 14px; border-radius: 8px; border: 1px solid #e5e7eb; background: #fff; cursor: pointer; font-size: 12px; font-weight: 600; color: #6b7280; transition: all 0.15s; }
.reset-btn:hover { background: #f9fafb; border-color: #9ca3af; }
.moved-tag { font-size: 10px; padding: 1px 6px; border-radius: 10px; background: #ede9fe; color: #6d28d9; margin-right: 4px; font-weight: 600; white-space: nowrap; }
.vat-note { font-size: 10px; color: #9ca3af; margin-top: 2px; text-align: center; }
.net-cell { font-size: 12px; color: #6b7280; }

var ITEMS = JSON.parse(JSON.stringify(ORIGINAL));
var movedItems = {};
var changedPrices = {};

function calcMedians() {
  var qtys = ITEMS.map(function(i) { return i.qty; }).sort(function(a,b) { return a-b; });
  var profits = ITEMS.map(function(i) { return i.profit_per; }).sort(function(a,b) { return a-b; });
  return {
    medQty: qtys[Math.floor(qtys.length / 2)],
    medProfit: profits[Math.floor(profits.length / 2)]
  };
}

function recalcItem(item) {
  // User enters VAT-inclusive price. Net = VAT_price / 1.18
  item.net_price = item.vat_price / VAT;
  item.fc_pct = item.net_price > 0 ? (item.recipe_cost / item.net_price * 100) : 0;
  item.profit_per = item.net_price - item.recipe_cost;
  item.profit = Math.round(item.profit_per * item.qty);
  item.sales_net = Math.round(item.net_price * item.qty);
}

function classifyAll() {
  var m = calcMedians();
  ITEMS.forEach(function(i) {
    var oldQ = i.q || '';
    var hv = i.qty >= m.medQty;
    var hp = i.profit_per >= m.medProfit;
    var newQ;
    if (hv && hp) newQ = 'star';
    else if (hv && !hp) newQ = 'plowhorse';
    else if (!hv && hp) newQ = 'puzzle';
    else newQ = 'dog';
    if (oldQ && oldQ !== newQ) {
      movedItems[i.name] = oldQ + '→' + newQ;
    }
    i.q = newQ;
  });
}

ITEMS.forEach(function(i) { recalcItem(i); });

  if (pct <= 25) return 'fc-low';

}

  ['star','plowhorse','puzzle','dog'].forEach(function(k) {
    var q = quads[k];
    h += '<div class="section" id="sec-' + k + '">';
    h += '<div class="section-title"><span class="badge ' + k + '">' + q.name + '</span> <span style="font-size:13px;color:#6b7280">' + q.desc + '</span> <span style="font-size:12px;color:#9ca3af;margin-right:auto">' + q.items.length + ' פריטים</span></div>';
    h += '<table><thead><tr><th>#</th><th>פריט</th><th>כמות</th><th>מחיר כולל מע"מ</th><th>מחיר נטו</th><th>עלות מזון/יח</th><th>% עלות מזון</th><th>רווח/יח</th><th>רווח כולל</th></tr></thead><tbody>';
    q.items.forEach(function(item, idx) {
      var safeName = item.name.replace(/'/g, "\\'");
      var moved = movedItems[item.name];
      var movedTag = moved ? '<span class="moved-tag">' + moved + '</span>' : '';
      var profitColor = item.profit_per < 0 ? '#dc2626' : '#059669';
      var changedClass = changedPrices[item.name] ? 'changed' : '';
      h += '<tr id="row-' + item.name.replace(/[^א-תa-zA-Z0-9]/g,'_') + '">';
      h += '<td>' + (idx+1) + '</td>';
      h += '<td style="font-weight:600">' + movedTag + item.name + '</td>';
      h += '<td>' + item.qty.toLocaleString('he-IL') + '</td>';
      h += '<td style="text-align:center"><input class="price-input ' + changedClass + '" type="number" step="0.1" value="' + item.vat_price.toFixed(2) + '" onchange="onPriceChange(this, \'' + safeName + '\')" onfocus="this.select()"></td>';
      h += '<td class="net-cell">' + fmt2(item.net_price) + '</td>';
      h += '<td>' + fmt2(item.recipe_cost) + '</td>';
      h += '<td><span class="fc-pct ' + fcClass(item.fc_pct) + '">' + item.fc_pct.toFixed(1) + '%</span></td>';
      h += '<td style="color:' + profitColor + ';font-weight:600">' + fmt2(item.profit_per) + '</td>';
      h += '<td style="font-weight:700;color:' + profitColor + '">' + fmt(item.profit) + '</td>';
      h += '</tr>';
    });
    h += '</tbody></table></div>';
  });
  document.getElementById('sections').innerHTML = h;
}

function onPriceChange(input, name) {
  var newPrice = parseFloat(input.value);
  if (isNaN(newPrice) || newPrice < 0) return;
  var item = ITEMS.find(function(i) { return i.name === name; });
  if (!item) return;
  // Check if different from original
  var orig = ORIGINAL.find(function(i) { return i.name === name; });
  if (orig && Math.abs(newPrice - orig.vat_price) > 0.01) {
    changedPrices[name] = true;
  } else {
    delete changedPrices[name];
  }
  item.vat_price = newPrice;
  recalcItem(item);
  classifyAll();
  renderKPIs();
  renderSections();
  setTimeout(function() {
    var row = document.getElementById('row-' + name.replace(/[^א-תa-zA-Z0-9]/g,'_'));
    if (row) row.classList.add('flash');
  }, 50);
}

function resetAll() {
  ITEMS = JSON.parse(JSON.stringify(ORIGINAL));
  movedItems = {};
  changedPrices = {};
  ITEMS.forEach(function(i) { recalcItem(i); });
  classifyAll();
  renderKPIs();
  renderSections();
}

renderKPIs();
renderSections();
</script>
</body>
</html>
