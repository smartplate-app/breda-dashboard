    h += '<tr><td>' + (i+1) + '</td><td style="font-weight:600">' + item.name + '</td><td>' + item.qty.toLocaleString('he-IL') + '</td><td style="color:' + profitColor + '">' + fmt2(item.profit_per) + '</td><td style="font-weight:700;color:' + profitColor + '">' + fmt(item.profit) + '</td><td style="color:' + fcColor + '">' + fmt2(item.fc_per) + '</td></tr>';
  });
  h += '</tbody></table></div>';
});

document.getElementById('content').innerHTML = h;
</script>
</body>
