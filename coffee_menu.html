var ITEMS = JSON.parse(JSON.stringify(ORIGINAL));
var movedItems = {}; // track which items moved

function calcMedians() {
  var qtys = ITEMS.map(function(i) { return i.qty; }).sort(function(a,b) { return a-b; });
  var profits = ITEMS.map(function(i) { return i.profit_per; }).sort(function(a,b) { return a-b; });
  var mq = qtys[Math.floor(qtys.length / 2)];
  var mp = profits[Math.floor(profits.length / 2)];
  return { medQty: mq, medProfit: mp };
}

function classifyAll() {
  var m = calcMedians();
  ITEMS.forEach(function(i) {
    var oldQ = i.q || '';
    var hv = i.qty >= m.medQty;
    var hp = i.profit_per >= m.medProfit;
    var newQ;
    if (hv && hp) newQ = 'star';
    else if (hv && !hp) newQ = 'plowhorse';
    else if (!hv && hp) newQ = 'puzzle';
    else newQ = 'dog';
    if (oldQ && oldQ !== newQ) {
      movedItems[i.name] = oldQ + '→' + newQ;
    }
    i.q = newQ;
  });
}

function recalcItem(item) {
  item.profit_per = item.menu_price - item.recipe_cost;
  item.profit = Math.round(item.profit_per * item.qty);
  item.fc_pct = item.menu_price > 0 ? (item.recipe_cost / item.menu_price * 100) : 0;
  item.sales = Math.round(item.menu_price * item.qty);
}

// Initialize
ITEMS.forEach(function(i) { recalcItem(i); });
classifyAll();

function fcClass(pct) {
  if (pct <= 25) return 'fc-low';
  if (pct <= 40) return 'fc-mid';
  return 'fc-high';
}

function renderKPIs() {
  var totalSales = ITEMS.reduce(function(s,i) { return s + i.sales; }, 0);
  var totalFC = ITEMS.reduce(function(s,i) { return s + i.recipe_cost * i.qty; }, 0);
  var totalProfit = ITEMS.reduce(function(s,i) { return s + i.profit; }, 0);
  var stars = ITEMS.filter(function(i) { return i.q === 'star'; }).length;
  var plow = ITEMS.filter(function(i) { return i.q === 'plowhorse'; }).length;
  var puzz = ITEMS.filter(function(i) { return i.q === 'puzzle'; }).length;
  var dogs = ITEMS.filter(function(i) { return i.q === 'dog'; }).length;

  document.getElementById('kpis').innerHTML =
    '<div class="kpi"><div class="kpi-label">סה"כ מכירות</div><div class="kpi-value">' + fmt(totalSales) + '</div><div class="kpi-sub">162 פריטים</div></div>' +
    '<div class="kpi orange"><div class="kpi-label">עלות מזון</div><div class="kpi-value">' + fmt(totalFC) + '</div><div class="kpi-sub">' + (totalFC/totalSales*100).toFixed(1) + '% ממכירות</div></div>' +
    '<div class="kpi green"><div class="kpi-label">סה"כ רווח</div><div class="kpi-value">' + fmt(totalProfit) + '</div><div class="kpi-sub">' + (totalProfit/totalSales*100).toFixed(1) + '% רווחיות</div></div>' +
    '<div class="kpi blue"><div class="kpi-label">Stars</div><div class="kpi-value">' + stars + '</div><div class="kpi-sub">רווח+כמות גבוה</div></div>' +
    '<div class="kpi purple"><div class="kpi-label">Plowhorses</div><div class="kpi-value">' + plow + '</div><div class="kpi-sub">כמות גבוה, רווח נמוך</div></div>' +
    '<div class="kpi"><div class="kpi-label">Puzzles</div><div class="kpi-value">' + puzz + '</div><div class="kpi-sub">רווח גבוה, כמות נמוכה</div></div>' +
    '<div class="kpi red"><div class="kpi-label">Dogs</div><div class="kpi-value">' + dogs + '</div><div class="kpi-sub">שקול הסרה</div></div>';
}

function renderSections() {
  var quads = {
    star: { name: 'Stars ⭐', desc: 'רווח גבוה + כמות גבוהה — השאר כמו שהם', items: [] },
    plowhorse: { name: 'Plowhorses 🐴', desc: 'רווח נמוך + כמות גבוהה — העלה מחיר או הורד עלות', items: [] },
    puzzle: { name: 'Puzzles 🧩', desc: 'רווח גבוה + כמות נמוכה — קדם יותר', items: [] },
    dog: { name: 'Dogs 🐕', desc: 'רווח נמוך + כמות נמוכה — שקול להסיר', items: [] }
  };
  ITEMS.forEach(function(i) { quads[i.q].items.push(i); });
  ['star','plowhorse','puzzle','dog'].forEach(function(k) { quads[k].items.sort(function(a,b) { return b.profit - a.profit; }); });

  var h = '';
  ['star','plowhorse','puzzle','dog'].forEach(function(k) {
    var q = quads[k];
    h += '<div class="section" id="sec-' + k + '">';
    h += '<div class="section-title"><span class="badge ' + k + '">' + q.name + '</span> <span style="font-size:13px;color:#6b7280">' + q.desc + '</span> <span style="font-size:12px;color:#9ca3af;margin-right:auto">' + q.items.length + ' פריטים</span></div>';
    h += '<table><thead><tr><th>#</th><th>פריט</th><th>כמות</th><th>מחיר תפריט</th><th>עלות/יח</th><th>% עלות מזון</th><th>רווח/יחידה</th><th>רווח כולל</th></tr></thead><tbody>';
    q.items.forEach(function(item, idx) {
      var moved = movedItems[item.name];
      var movedTag = moved ? '<span class="moved-tag">' + moved + '</span>' : '';
      var profitColor = item.profit_per < 0 ? '#dc2626' : '#059669';
      h += '<tr id="row-' + item.name.replace(/[^א-תa-zA-Z0-9]/g,'_') + '">';
      h += '<td>' + (idx+1) + '</td>';
      h += '<td style="font-weight:600">' + movedTag + item.name + '</td>';
      h += '<td>' + item.qty.toLocaleString('he-IL') + '</td>';
      h += '<td><input class="price-input" type="number" step="0.1" value="' + item.menu_price.toFixed(2) + '" onchange="onPriceChange(this, \'' + item.name.replace(/'/g,'\\\'') + '\')" onfocus="this.select()"></td>';
      h += '<td>' + fmt2(item.recipe_cost) + '</td>';
      h += '<td><span class="fc-pct ' + fcClass(item.fc_pct) + '">' + item.fc_pct.toFixed(1) + '%</span></td>';
      h += '<td style="color:' + profitColor + ';font-weight:600">' + fmt2(item.profit_per) + '</td>';
      h += '<td style="font-weight:700;color:' + profitColor + '">' + fmt(item.profit) + '</td>';
      h += '</tr>';
    });
    h += '</tbody></table></div>';
  });
  document.getElementById('sections').innerHTML = h;
}

function onPriceChange(input, name) {
  var newPrice = parseFloat(input.value);
  if (isNaN(newPrice) || newPrice < 0) return;
  var item = ITEMS.find(function(i) { return i.name === name; });
  if (!item) return;
  item.menu_price = newPrice;
  recalcItem(item);
  classifyAll();
  renderKPIs();
  renderSections();
  // Flash the row in its new position
  setTimeout(function() {
    var row = document.getElementById('row-' + name.replace(/[^א-תa-zA-Z0-9]/g,'_'));
    if (row) row.classList.add('flash');
  }, 50);
}

function resetAll() {
  ITEMS = JSON.parse(JSON.stringify(ORIGINAL));
  movedItems = {};
  ITEMS.forEach(function(i) { recalcItem(i); });
  classifyAll();
  renderKPIs();
  renderSections();
}

renderKPIs();
renderSections();
</script>
