<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breda Factory — הנמל | SmartPlate</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f1117; color: #e2e8f0; font-family: 'Segoe UI', Arial, sans-serif; min-height: 100vh; }

  /* Header */
  .header { background: #1a1d2e; border-bottom: 1px solid #2d3056; padding: 18px 32px; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-size: 22px; font-weight: 800; color: #fff; }
  .logo span { color: #f59e0b; }
  .sub-logo { font-size: 14px; color: #8892a4; margin-top: 2px; }
  .last-sync { font-size: 12px; color: #64748b; }

  /* Tabs */
  .tabs { display: flex; gap: 0; background: #1a1d2e; border-bottom: 1px solid #2d3056; padding: 0 32px; }
  .tab { padding: 14px 28px; font-size: 14px; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; color: #8892a4; transition: all 0.2s; }
  .tab.active { color: #f59e0b; border-bottom-color: #f59e0b; }

  /* Main */
  .main { padding: 28px 32px; max-width: 1400px; margin: 0 auto; }
  .month-panel { display: none; }
  .month-panel.active { display: block; }

  /* KPI Grid */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .kpi { background: #1a1d2e; border: 1px solid #2d3056; border-radius: 12px; padding: 20px; }
  .kpi-label { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .kpi-value { font-size: 26px; font-weight: 800; color: #fff; }
  .kpi-sub { font-size: 13px; color: #8892a4; margin-top: 4px; }
  .kpi.green .kpi-value { color: #34d399; }
  .kpi.yellow .kpi-value { color: #fbbf24; }
  .kpi.red .kpi-value { color: #f87171; }
  .kpi.orange .kpi-value { color: #f59e0b; }

  /* Section */
  .section { background: #1a1d2e; border: 1px solid #2d3056; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
  .section-title { font-size: 15px; font-weight: 700; color: #a0aec0; margin-bottom: 16px; }

  /* Table */
  table { width: 100%; border-collapse: collapse; }
  th { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; padding: 8px 12px; text-align: right; border-bottom: 1px solid #2d3056; }
  td { padding: 10px 12px; font-size: 14px; border-bottom: 1px solid #1e2235; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(245, 158, 11, 0.04); }

  /* Bar */
  .bar-wrap { display: flex; align-items: center; gap: 10px; }
  .bar-bg { flex: 1; height: 6px; background: #2d3056; border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; background: #f59e0b; transition: width 0.4s; }
  .bar-fill.green { background: #34d399; }
  .bar-fill.yellow { background: #fbbf24; }
  .bar-fill.red { background: #f87171; }

  /* Badge */
  .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }
  .badge.green { background: rgba(52,211,153,0.15); color: #34d399; }
  .badge.yellow { background: rgba(251,191,36,0.15); color: #fbbf24; }
  .badge.red { background: rgba(248,113,113,0.15); color: #f87171; }

  /* Daily chart */
  .chart-container { overflow-x: auto; }
  .chart-bars { display: flex; align-items: flex-end; gap: 4px; height: 120px; padding-bottom: 4px; min-width: 600px; }
  .chart-day { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; min-width: 22px; }
  .chart-bar { width: 100%; background: #f59e0b; border-radius: 3px 3px 0 0; transition: height 0.4s; }
  .chart-bar.wolt { background: #6c63ff; }
  .chart-label { font-size: 9px; color: #64748b; }
  .chart-legend { display: flex; gap: 20px; margin-top: 12px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #8892a4; }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; }

  /* Prime cost gauge */
  .gauge-wrap { display: flex; align-items: center; gap: 20px; margin-bottom: 16px; }
  .gauge { width: 180px; height: 12px; background: #2d3056; border-radius: 6px; overflow: hidden; position: relative; }
  .gauge-fill { height: 100%; border-radius: 6px; transition: width 0.5s; }
  .gauge-mark { position: absolute; top: -3px; width: 2px; height: 18px; background: #475569; }
  .gauge-label { font-size: 11px; color: #64748b; position: absolute; top: 20px; transform: translateX(-50%); }
</style>
</head>

function fmt(n) {
  return '₪' + Math.round(n).toLocaleString('he-IL');
}

function pctClass(p) {
  if (p <= 45) return 'green';
  if (p <= 55) return 'yellow';
  return 'red';
}

function renderMonth(key) {
  const d = DATA[key];
  const nonWolt = d.sales_vat - d.wolt_vat;
  const primeCost = d.labor_pct + d.food_cost_pct;
  const primeClass = pctClass(primeCost);
  
  let html = '';

  // KPI Grid
  html += '<div class="kpi-grid">';
  
  html += `<div class="kpi"><div class="kpi-label">מכירות ברוטו (כולל מע"מ)</div><div class="kpi-value">${fmt(d.sales_vat)}</div><div class="kpi-sub">נטו: ${fmt(d.sales_net)} | ${d.days_collected} ימים</div></div>`;
  
  html += `<div class="kpi orange"><div class="kpi-label">Wolt</div><div class="kpi-value">${fmt(d.wolt_vat)}</div><div class="kpi-sub">${d.wolt_pct}% ממכירות | עמלה: ${fmt(d.wolt_commission)}</div></div>`;
  
  html += `<div class="kpi"><div class="kpi-label">מכירות עצמיות (ללא Wolt)</div><div class="kpi-value">${fmt(nonWolt)}</div><div class="kpi-sub">${round1(nonWolt / d.sales_vat * 100)}% מסה"כ</div></div>`;

  const laborClass = d.labor_pct <= 25 ? 'green' : d.labor_pct <= 35 ? 'yellow' : 'red';
  html += `<div class="kpi ${laborClass}"><div class="kpi-label">עלות שכר (נטו)</div><div class="kpi-value">${fmt(d.labor_cost)}</div><div class="kpi-sub">${d.labor_pct}% ממכירות נטו | ${d.labor_hours} שעות</div></div>`;

  if (d.food_cost > 0) {
    const foodClass = d.food_cost_pct <= 25 ? 'green' : d.food_cost_pct <= 35 ? 'yellow' : 'red';
    html += `<div class="kpi ${foodClass}"><div class="kpi-label">עלות מזון (נטו)</div><div class="kpi-value">${fmt(d.food_cost)}</div><div class="kpi-sub">${d.food_cost_pct}% ממכירות נטו</div></div>`;
  } else {
    html += `<div class="kpi"><div class="kpi-label">עלות מזון</div><div class="kpi-value">—</div><div class="kpi-sub">טרם עודכן לחודש זה</div></div>`;
  }

  html += `<div class="kpi ${primeClass}"><div class="kpi-label">Prime Cost (שכר + מזון)</div><div class="kpi-value">${round1(primeCost)}%</div><div class="kpi-sub">יעד: ≤60% | ${primeClass === 'green' ? 'ירוק ✅' : primeClass === 'yellow' ? 'צהוב ⚠️' : 'אדום 🔴'}</div></div>`;

  html += `<div class="kpi"><div class="kpi-label">ממוצע יומי</div><div class="kpi-value">${fmt(d.sales_vat / d.days_collected)}</div><div class="kpi-sub">ברוטו ליום</div></div>`;

  html += '</div>';

  // Daily sales chart
  html += '<div class="section">';
  html += '<div class="section-title">מכירות יומיות (ברוטו)</div>';
  html += '<div class="chart-container"><div class="chart-bars">';
  const maxSales = Math.max(...d.daily_sales.map(x => x.sales));
  for (const day of d.daily_sales) {
    const h = (day.sales / maxSales * 100).toFixed(0);
    html += `<div class="chart-day"><div class="chart-bar" style="height:${h}%"></div><div class="chart-label">${day.date}</div></div>`;
  }
  html += '</div></div>';
  html += `<div class="chart-legend"><div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div>מכירות יומיות</div></div>`;
  html += '</div>';

  // Top items table
  if (d.top_items.length > 0) {
    html += '<div class="section">';
    html += '<div class="section-title">מנות מובילות — Menu Engineering (MarketMan)</div>';
    html += '<table><thead><tr><th>#</th><th>פריט</th><th>כמות</th><th>מכירות</th><th>עלות מזון</th><th>רווח ליחידה</th><th>רווח כולל</th></tr></thead><tbody>';
    d.top_items.forEach((item, i) => {
      html += `<tr><td>${i+1}</td><td>${item.name}</td><td>${item.qty.toLocaleString('he-IL')}</td><td>${fmt(item.sales)}</td><td>${fmt(item.fc)}</td><td>${fmt(item.profit_per)}</td><td style="font-weight:700">${fmt(item.profit)}</td></tr>`;
    });
    html += '</tbody></table>';
    html += '</div>';
  }

  // Wolt breakdown
  html += '<div class="section">';
  html += '<div class="section-title">פירוט Wolt</div>';
  html += '<table><tbody>';
  html += `<tr><td>מכירות Wolt (ברוטו)</td><td style="font-weight:700">${fmt(d.wolt_vat)}</td></tr>`;
  html += `<tr><td>אחוז מסה"כ מכירות</td><td>${d.wolt_pct}%</td></tr>`;
  html += `<tr><td>עמלת Wolt (24%)</td><td style="color:#f87171">${fmt(d.wolt_commission)}</td></tr>`;
  html += `<tr><td>מכירות עצמיות (ללא Wolt)</td><td style="font-weight:700">${fmt(nonWolt)}</td></tr>`;
  html += `<tr><td>מכירות נטו (ללא מע"מ)</td><td>${fmt(d.sales_net)}</td></tr>`;
  html += '</tbody></table>';
  html += '</div>';

  // Prime cost gauge
  html += '<div class="section">';
  html += '<div class="section-title">Prime Cost — שכר + מזון (% ממכירות נטו)</div>';
  html += '<div class="gauge-wrap">';
  const gaugeWidth = Math.min(primeCost / 80 * 100, 100);
  const gaugeColor = primeClass === 'green' ? '#34d399' : primeClass === 'yellow' ? '#fbbf24' : '#f87171';
  html += `<div class="gauge"><div class="gauge-fill" style="width:${gaugeWidth}%;background:${gaugeColor}"></div><div class="gauge-mark" style="left:60%"><div class="gauge-label">60%</div></div><div class="gauge-mark" style="left:75%"><div class="gauge-label">75%</div></div></div>`;
  html += `<div style="font-size:28px;font-weight:800;color:${gaugeColor}">${round1(primeCost)}%</div>`;
  html += '</div>';
  html += `<div style="font-size:13px;color:#8892a4">שכר: ${d.labor_pct}% + מזון: ${d.food_cost_pct}% = ${round1(primeCost)}% | יעד: ≤60% (ירוק)</div>`;
  html += '</div>';

  document.getElementById(key + '-content').innerHTML = html;
}

function round1(n) {
  return Math.round(n * 10) / 10;
}

function switchTab(key) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.month-panel').forEach(p => p.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('panel-' + key).classList.add('active');
}

</script>
