<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breda Factory | SmartPlate</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f1117; color: #e2e8f0; font-family: 'Segoe UI', Arial, sans-serif; min-height: 100vh; }

  .header { background: #1a1d2e; border-bottom: 1px solid #2d3056; padding: 18px 32px; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-size: 22px; font-weight: 800; color: #fff; }
  .logo span { color: #f59e0b; }
  .sub-logo { font-size: 14px; color: #8892a4; margin-top: 2px; }
  .last-sync { font-size: 12px; color: #64748b; }

  .main { padding: 28px 32px; max-width: 1400px; margin: 0 auto; }

  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .kpi { background: #1a1d2e; border: 1px solid #2d3056; border-radius: 12px; padding: 20px; }
  .kpi-label { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .kpi-value { font-size: 26px; font-weight: 800; color: #fff; }
  .kpi-sub { font-size: 13px; color: #8892a4; margin-top: 4px; }
  .kpi.green .kpi-value { color: #34d399; }
  .kpi.yellow .kpi-value { color: #fbbf24; }
  .kpi.red .kpi-value { color: #f87171; }
  .kpi.orange .kpi-value { color: #f59e0b; }

  .section { background: #1a1d2e; border: 1px solid #2d3056; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
  .section-title { font-size: 15px; font-weight: 700; color: #a0aec0; margin-bottom: 16px; }

  table { width: 100%; border-collapse: collapse; }
  th { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; padding: 8px 12px; text-align: right; border-bottom: 1px solid #2d3056; }
  td { padding: 10px 12px; font-size: 14px; border-bottom: 1px solid #1e2235; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(245, 158, 11, 0.04); }

  .gauge-wrap { display: flex; align-items: center; gap: 20px; margin-bottom: 8px; }
  .gauge { width: 100%; max-width: 400px; height: 12px; background: #2d3056; border-radius: 6px; overflow: hidden; position: relative; }
  .gauge-fill { height: 100%; border-radius: 6px; }
  .gauge-mark { position: absolute; top: -3px; width: 2px; height: 18px; background: #475569; }
  .gauge-label { font-size: 12px; color: #64748b; margin-top: 8px; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="logo">Breda <span>Factory</span></div>
    <div class="sub-logo">SmartPlate | MarketMan (Sales + Food Cost) × ShiftOrganizer (Labor)</div>
  </div>
  <div class="last-sync">עודכן: 05.08.2026</div>
</div>

<div class="main" id="content"></div>

<script>
const SALES = 438814;
const FOOD_COST = 79465;
const FOOD_PCT = 18.1;
const LABOR = 180171;
const LABOR_PCT = 41.1;
const PRIME = 59.2;
const PROFIT = SALES - FOOD_COST - LABOR;
const PROFIT_PCT = Math.round(PROFIT / SALES * 1000) / 10;

const WORKERS = [
  {"name":"310 קונסטנטין מדבדובסקי","role":"מנהל מפעל","hours":234.2,"cost":13046},
  {"name":"353 ולדימיר קביאטקובסקי","role":"מנהל אפייה","hours":204.0,"cost":12000},
  {"name":"367 אולגה קים","role":"קונדיטוריה","hours":169.7,"cost":12000},
  {"name":"393 saned","role":"אפייה","hours":127.4,"cost":12000},
  {"name":"404 פולינה ארגנטיפליק","role":"בצקים","hours":222.2,"cost":11070},
  {"name":"225 סטפן שולגה","role":"קונדיטוריה","hours":195.0,"cost":10889},
  {"name":"334 ליבי הררי ארנולד","role":"בצקים","hours":191.6,"cost":10637},
  {"name":"370 שהד עיסאוי","role":"קונדיטוריה","hours":189.2,"cost":10449},
  {"name":"371 Abaker Hamid","role":"ניקיון","hours":160.9,"cost":9678},
  {"name":"324 מאיה פיזיק","role":"בצקים","hours":157.8,"cost":9595},
  {"name":"354 רומן פישמן","role":"בצקים","hours":187.7,"cost":9307},
  {"name":"40 ויקטור ושצ'נקו","role":"אפייה","hours":185.3,"cost":9307},
  {"name":"389 סרגיי גברילנקו","role":"אפייה","hours":135.9,"cost":9011},
  {"name":"416 לוי אליה","role":"ניקיון","hours":163.9,"cost":7936},
  {"name":"301 קתרינה יורטשוק","role":"קונדיטוריה","hours":145.6,"cost":7428},
  {"name":"415 מרינה גינסין","role":"קונדיטוריה","hours":146.8,"cost":7056},
  {"name":"410 ריבר סטריידר","role":"בצקים","hours":134.9,"cost":6562},
  {"name":"202 סופיה","role":"קונדיטוריה","hours":114.9,"cost":6212},
  {"name":"188 דניאל קונסטנטינוב","role":"קונדיטוריה","hours":83.2,"cost":5688},
  {"name":"315 אורית אזולאי","role":"קונדיטוריה","hours":5.6,"cost":301}
];

const TOP_ITEMS = [
  {"name":"לחמניה פרעצל","qty":16108,"sales":65539,"fc":5540,"profit":59999,"profit_per":3.72},
  {"name":"ג'בטה רגילה","qty":4612,"sales":18448,"fc":1913,"profit":16535,"profit_per":3.59},
  {"name":"לחם כפרי בלי תוספות","qty":1089,"sales":16082,"fc":1947,"profit":14135,"profit_per":12.98},
  {"name":"לחם כוסמין","qty":891,"sales":15523,"fc":2221,"profit":13302,"profit_per":14.93},
  {"name":"סינבון","qty":1647,"sales":14000,"fc":2962,"profit":11037,"profit_per":6.70},
  {"name":"קרואסון חמאה","qty":1907,"sales":13349,"fc":2966,"profit":10383,"profit_per":5.44},
  {"name":"לחם חיטה מלאה","qty":704,"sales":12041,"fc":1779,"profit":10262,"profit_per":14.58},
  {"name":"לחם שיפון פרג אגוזים","qty":791,"sales":12012,"fc":1986,"profit":10026,"profit_per":12.68},
  {"name":"קרואסון שקדים","qty":1315,"sales":13150,"fc":4527,"profit":8623,"profit_per":6.56},
  {"name":"בריוש הל","qty":696,"sales":8352,"fc":518,"profit":7834,"profit_per":11.26},
  {"name":"גבינה מתוקה אפויה קטן","qty":556,"sales":8340,"fc":1353,"profit":6987,"profit_per":12.57},
  {"name":"מגש פוקאצ'יה","qty":318,"sales":8586,"fc":1631,"profit":6955,"profit_per":21.87},
  {"name":"קרואסון שוקולד","qty":1213,"sales":9704,"fc":2763,"profit":6941,"profit_per":5.72},
  {"name":"קרואסון פיסטוק שוקולד","qty":926,"sales":9765,"fc":2985,"profit":6780,"profit_per":7.32},
  {"name":"לחמניה בורגר דלעת","qty":3080,"sales":7700,"fc":1565,"profit":6135,"profit_per":1.99}
];

function fmt(n){return '₪'+Math.round(n).toLocaleString('he-IL');}

function pctClass(p){if(p<=60)return'green';if(p<=75)return'yellow';return'red';}

const pc = pctClass(PRIME);
const gc = pc==='green'?'#34d399':pc==='yellow'?'#fbbf24':'#f87171';

let h = '';

// KPIs
h += '<div class="kpi-grid">';
h += `<div class="kpi"><div class="kpi-label">מכירות (MarketMan — נטו)</div><div class="kpi-value">${fmt(SALES)}</div><div class="kpi-sub">דוח רווחיות מנות | 94 פריטים | 56,832 יחידות</div></div>`;
h += `<div class="kpi green"><div class="kpi-label">עלות מזון (MarketMan)</div><div class="kpi-value">${fmt(FOOD_COST)}</div><div class="kpi-sub">${FOOD_PCT}% ממכירות נטו</div></div>`;
h += `<div class="kpi orange"><div class="kpi-label">עלות שכר (ShiftOrganizer)</div><div class="kpi-value">${fmt(LABOR)}</div><div class="kpi-sub">${LABOR_PCT}% ממכירות נטו | 20 עובדים | 3,156שעה</div></div>`;
h += `<div class="kpi ${pc}"><div class="kpi-label">Prime Cost (שכר + מזון)</div><div class="kpi-value">${PRIME}%</div><div class="kpi-sub">יעד: ≤60% ${pc==='green'?'✅ ירוק':pc==='yellow'?'⚠️ צהוב':'🔴 אדום'}</div></div>`;
h += `<div class="kpi green"><div class="kpi-label">רווח תפעולי</div><div class="kpi-value">${fmt(PROFIT)}</div><div class="kpi-sub">${PROFIT_PCT}% ממכירות נטו</div></div>`;
h += '</div>';

// Prime cost gauge
h += '<div class="section"><div class="section-title">Prime Cost — שכר + מזון (% ממכירות נטו)</div><div class="gauge-wrap">';
h += `<div class="gauge"><div class="gauge-fill" style="width:${Math.min(PRIME/80*100,100)}%;background:${gc}"></div><div class="gauge-mark" style="left:60%"></div><div class="gauge-mark" style="left:75%"></div></div>`;
h += `<div style="font-size:28px;font-weight:800;color:${gc}">${PRIME}%</div></div>`;
h += `<div class="gauge-label">שכר: ${LABOR_PCT}% + מזון: ${FOOD_PCT}% = ${PRIME}% | יעד: ≤60% (ירוק) | 60-75% (צהוב) | >75% (אדום)</div></div>`;

// Workers
h += '<div class="section"><div class="section-title">עובדים — ShiftOrganizer (20 עובדים)</div>';
h += '<table><thead><tr><th>#</th><th>עובד</th><th>תפקיד</th><th>שעות</th><th>עלות מעסיק</th><th>₪/שעה</th></tr></thead><tbody>';
WORKERS.forEach((w,i)=>{
  const rate = w.hours>0 ? Math.round(w.cost/w.hours) : 0;
  h += `<tr><td>${i+1}</td><td>${w.name}</td><td>${w.role}</td><td>${w.hours}</td><td style="font-weight:700">${fmt(w.cost)}</td><td>${rate>0?fmt(rate):'—'}</td></tr>`;
});
h += `<tr style="background:rgba(245,158,11,0.08)"><td colspan="3" style="font-weight:700">סה"כ</td><td style="font-weight:700">3,155.8</td><td style="font-weight:700">${fmt(LABOR)}</td><td></td></tr>`;
h += '</tbody></table></div>';

// Top items
h += '<div class="section"><div class="section-title">מנות מובילות — דוח רווחיות מנות (MarketMan)</div>';
h += '<table><thead><tr><th>#</th><th>פריט</th><th>כמות</th><th>מכירות</th><th>עלות מזון</th><th>רווח ליחידה</th><th>רווח כולל</th></tr></thead><tbody>';
TOP_ITEMS.forEach((item,i)=>{
  h += `<tr><td>${i+1}</td><td>${item.name}</td><td>${item.qty.toLocaleString('he-IL')}</td><td>${fmt(item.sales)}</td><td>${fmt(item.fc)}</td><td>${fmt(item.profit_per)}</td><td style="font-weight:700;color:#34d399">${fmt(item.profit)}</td></tr>`;
});
h += '</tbody></table></div>';

// P&L summary
h += '<div class="section"><div class="section-title">סיכום פיננסי</div><table><tbody>';
h += `<tr><td>מכירות (נטו)</td><td style="font-weight:700">${fmt(SALES)}</td></tr>`;
h += `<tr><td>עלות מזון</td><td style="color:#f87171">-${fmt(FOOD_COST)}</td><td>${FOOD_PCT}%</td></tr>`;
h += `<tr><td>עלות שכר</td><td style="color:#f87171">-${fmt(LABOR)}</td><td>${LABOR_PCT}%</td></tr>`;
h += `<tr style="background:rgba(52,211,153,0.08)"><td style="font-weight:700">רווח תפעולי</td><td style="font-weight:700;color:#34d399">${fmt(PROFIT)}</td><td>${PROFIT_PCT}%</td></tr>`;
h += '</tbody></table></div>';

document.getElementById('content').innerHTML = h;
</script>

</body>
</html>
