<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breda Factory — הנמל | SmartPlate</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f1117; color: #e2e8f0; font-family: 'Segoe UI', Arial, sans-serif; min-height: 100vh; }

  /* Header */
  .header { background: #1a1d2e; border-bottom: 1px solid #2d3056; padding: 18px 32px; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-size: 22px; font-weight: 800; color: #fff; }
  .logo span { color: #f59e0b; }
  .sub-logo { font-size: 14px; color: #8892a4; margin-top: 2px; }
  .last-sync { font-size: 12px; color: #64748b; }

  /* Tabs */
  .tabs { display: flex; gap: 0; background: #1a1d2e; border-bottom: 1px solid #2d3056; padding: 0 32px; }
  .tab { padding: 14px 28px; font-size: 14px; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; color: #8892a4; transition: all 0.2s; }
  .tab.active { color: #f59e0b; border-bottom-color: #f59e0b; }

  /* Main */
  .main { padding: 28px 32px; max-width: 1400px; margin: 0 auto; }
  .month-panel { display: none; }
  .month-panel.active { display: block; }

  /* KPI Grid */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .kpi { background: #1a1d2e; border: 1px solid #2d3056; border-radius: 12px; padding: 20px; }
  .kpi-label { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .kpi-value { font-size: 26px; font-weight: 800; color: #fff; }
  .kpi-sub { font-size: 13px; color: #8892a4; margin-top: 4px; }
  .kpi.green .kpi-value { color: #34d399; }
  .kpi.yellow .kpi-value { color: #fbbf24; }
  .kpi.red .kpi-value { color: #f87171; }
  .kpi.orange .kpi-value { color: #f59e0b; }

  /* Section */
  .section { background: #1a1d2e; border: 1px solid #2d3056; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
  .section-title { font-size: 15px; font-weight: 700; color: #a0aec0; margin-bottom: 16px; }

  /* Table */
  table { width: 100%; border-collapse: collapse; }
  th { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; padding: 8px 12px; text-align: right; border-bottom: 1px solid #2d3056; }
  td { padding: 10px 12px; font-size: 14px; border-bottom: 1px solid #1e2235; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(245, 158, 11, 0.04); }

  /* Bar */
  .bar-wrap { display: flex; align-items: center; gap: 10px; }
  .bar-bg { flex: 1; height: 6px; background: #2d3056; border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; background: #f59e0b; transition: width 0.4s; }
  .bar-fill.green { background: #34d399; }
  .bar-fill.yellow { background: #fbbf24; }
  .bar-fill.red { background: #f87171; }

  /* Badge */
  .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }
  .badge.green { background: rgba(52,211,153,0.15); color: #34d399; }
  .badge.yellow { background: rgba(251,191,36,0.15); color: #fbbf24; }
  .badge.red { background: rgba(248,113,113,0.15); color: #f87171; }

  /* Daily chart */
  .chart-container { overflow-x: auto; }
  .chart-bars { display: flex; align-items: flex-end; gap: 4px; height: 120px; padding-bottom: 4px; min-width: 600px; }
  .chart-day { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; min-width: 22px; }
  .chart-bar { width: 100%; background: #f59e0b; border-radius: 3px 3px 0 0; transition: height 0.4s; }
  .chart-label { font-size: 9px; color: #64748b; }

  /* Prime cost gauge */
  .gauge-wrap { display: flex; align-items: center; gap: 20px; margin-bottom: 16px; }
  .gauge { width: 100%; height: 12px; background: #2d3056; border-radius: 6px; overflow: hidden; position: relative; }
  .gauge-fill { height: 100%; border-radius: 6px; transition: width 0.5s; }
  .gauge-mark { position: absolute; top: -3px; width: 2px; height: 18px; background: #475569; }
  .gauge-label { font-size: 11px; color: #64748b; margin-top: 8px; }
</style>
</head>

function fmt(n){return '₪'+Math.round(n).toLocaleString('he-IL');}
function r1(n){return Math.round(n*10)/10;}

function pctClass(p){if(p<=45)return'green';if(p<=55)return'yellow';return'red';}

function renderMonth(key){
  const d=DATA[key];
  const nonWolt=d.sales_vat-d.wolt_vat;
  const prime=d.labor_pct+d.food_cost_pct;
  const pc=pctClass(prime);
  let h='';

  // KPIs
  h+='<div class="kpi-grid">';
  h+=`<div class="kpi"><div class="kpi-label">מכירות ברוטו (כולל מע"מ)</div><div class="kpi-value">${fmt(d.sales_vat)}</div><div class="kpi-sub">נטו: ${fmt(d.sales_net)} | ${d.days_collected} ימים</div></div>`;
  h+=`<div class="kpi orange"><div class="kpi-label">Wolt</div><div class="kpi-value">${fmt(d.wolt_vat)}</div><div class="kpi-sub">${d.wolt_pct}% ממכירות | עמלה (24%): ${fmt(d.wolt_commission)}</div></div>`;
  h+=`<div class="kpi"><div class="kpi-label">מכירות עצמיות (ללא Wolt)</div><div class="kpi-value">${fmt(nonWolt)}</div><div class="kpi-sub">${r1(nonWolt/d.sales_vat*100)}% מסה"כ</div></div>`;
  const lc=d.labor_pct<=25?'green':d.labor_pct<=35?'yellow':'red';
  h+=`<div class="kpi ${lc}"><div class="kpi-label">עלות שכר — ShiftOrganizer</div><div class="kpi-value">${fmt(d.labor_cost)}</div><div class="kpi-sub">${d.labor_pct}% ממכירות נטו | ${d.labor_hours}שעה | ${d.workers.length} עובדים</div></div>`;
  if(d.food_cost>0){
    const fc=d.food_cost_pct<=25?'green':d.food_cost_pct<=35?'yellow':'red';
    h+=`<div class="kpi ${fc}"><div class="kpi-label">עלות מזון — MarketMan</div><div class="kpi-value">${fmt(d.food_cost)}</div><div class="kpi-sub">${d.food_cost_pct}% ממכירות נטו</div></div>`;
  } else {
    h+=`<div class="kpi"><div class="kpi-label">עלות מזון</div><div class="kpi-value">—</div><div class="kpi-sub">טרם עודכן</div></div>`;
  }
  if(d.food_cost>0){
    h+=`<div class="kpi ${pc}"><div class="kpi-label">Prime Cost (שכר + מזון)</div><div class="kpi-value">${r1(prime)}%</div><div class="kpi-sub">יעד: ≤60% | ${pc=='green'?'ירוק ✅':pc=='yellow'?'צהוב ⚠️':'אדום 🔴'}</div></div>`;
  } else {
    h+=`<div class="kpi ${lc}"><div class="kpi-label">Prime Cost (שכר בלבד)</div><div class="kpi-value">${r1(d.labor_pct)}%</div><div class="kpi-sub">מזון טרם עודכן — יעד מלא: ≤60%</div></div>`;
  }
  h+=`<div class="kpi"><div class="kpi-label">ממוצע יומי</div><div class="kpi-value">${fmt(d.sales_vat/d.days_collected)}</div><div class="kpi-sub">ברוטו ליום</div></div>`;
  h+='</div>';

  // Daily chart
  h+='<div class="section"><div class="section-title">מכירות יומיות (ברוטו — Tabit)</div><div class="chart-container"><div class="chart-bars">';
  const mx=Math.max(...d.daily_sales.map(x=>x.sales));
  for(const day of d.daily_sales){
    const ht=(day.sales/mx*100).toFixed(0);
    h+=`<div class="chart-day"><div class="chart-bar" style="height:${ht}%"></div><div class="chart-label">${day.date}</div></div>`;
  }
  h+='</div></div></div>';

  // Prime cost gauge
  if(d.food_cost>0){
    h+='<div class="section"><div class="section-title">Prime Cost — שכר + מזון (% ממכירות נטו)</div><div class="gauge-wrap">';
    const gw=Math.min(prime/80*100,100);
    const gc=pc=='green'?'#34d399':pc=='yellow'?'#fbbf24':'#f87171';
    h+=`<div class="gauge" style="max-width:400px"><div class="gauge-fill" style="width:${gw}%;background:${gc}"></div><div class="gauge-mark" style="left:60%"></div><div class="gauge-mark" style="left:75%"></div></div>`;
    h+=`<div style="font-size:28px;font-weight:800;color:${gc}">${r1(prime)}%</div>`;
    h+='</div><div class="gauge-label">שכר: '+d.labor_pct+'% + מזון: '+d.food_cost_pct+'% = '+r1(prime)+'% | יעד: ≤60% (ירוק) | 60-75% (צהוב) | >75% (אדום)</div></div>';
  }

  // Wolt breakdown
  h+='<div class="section"><div class="section-title">פירוט Wolt</div><table><tbody>';
  h+=`<tr><td>מכירות Wolt (ברוטו)</td><td style="font-weight:700">${fmt(d.wolt_vat)}</td></tr>`;
  h+=`<tr><td>אחוז מסה"כ מכירות</td><td>${d.wolt_pct}%</td></tr>`;
  h+=`<tr><td>עמלת Wolt (24%)</td><td style="color:#f87171">-${fmt(d.wolt_commission)}</td></tr>`;
  h+=`<tr><td>מכירות עצמיות (ללא Wolt)</td><td style="font-weight:700">${fmt(nonWolt)}</td></tr>`;
  h+=`<tr><td>מכירות נטו (ללא מע"מ)</td><td>${fmt(d.sales_net)}</td></tr>`;
  h+='</tbody></table></div>';

  // Workers table
  h+='<div class="section"><div class="section-title">עובדים — ShiftOrganizer ('+d.workers.length+' עובדים)</div>';
  h+='<table><thead><tr><th>#</th><th>עובד</th><th>תפקיד</th><th>שעות</th><th>עלות מעסיק</th><th>₪/שעה</th></tr></thead><tbody>';
  d.workers.forEach((w,i)=>{
    const rate=w.hours>0?Math.round(w.cost/w.hours):0;
    h+=`<tr><td>${i+1}</td><td>${w.name}</td><td>${w.role}</td><td>${w.hours}</td><td style="font-weight:700">${fmt(w.cost)}</td><td>${rate>0?fmt(rate):'—'}</td></tr>`;
  });
  h+=`<tr style="background:rgba(245,158,11,0.08)"><td colspan="3" style="font-weight:700">סה"כ</td><td style="font-weight:700">${d.labor_hours}</td><td style="font-weight:700">${fmt(d.labor_cost)}</td><td></td></tr>`;
  h+='</tbody></table></div>';

  // Top items
  if(d.top_items.length>0){
    h+='<div class="section"><div class="section-title">מנות מובילות — Menu Engineering (MarketMan)</div>';
    h+='<table><thead><tr><th>#</th><th>פריט</th><th>כמות</th><th>מכירות</th><th>עלות מזון</th><th>רווח ליחידה</th><th>רווח כולל</th></tr></thead><tbody>';
    d.top_items.forEach((item,i)=>{
      h+=`<tr><td>${i+1}</td><td>${item.name}</td><td>${item.qty.toLocaleString('he-IL')}</td><td>${fmt(item.sales)}</td><td>${fmt(item.fc)}</td><td>${fmt(item.profit_per)}</td><td style="font-weight:700;color:#34d399">${fmt(item.profit)}</td></tr>`;
    });
    h+='</tbody></table></div>';
  }

  document.getElementById(key+'-content').innerHTML=h;
}

function switchTab(key){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.month-panel').forEach(p=>p.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('panel-'+key).classList.add('active');
}

renderMonth('jul');
renderMonth('aug');
</script>

</html>
