  .main { padding: 24px 32px; max-width: 1400px; margin: 0 auto; }

  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .kpi { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 18px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
  .kpi-label { font-size: 11px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .kpi-value { font-size: 24px; font-weight: 800; color: #111827; }
  .kpi-sub { font-size: 12px; color: #6b7280; margin-top: 4px; }
  .kpi.green .kpi-value { color: #059669; }
  .kpi.yellow .kpi-value { color: #d97706; }
  .kpi.red .kpi-value { color: #dc2626; }
  .kpi.orange .kpi-value { color: #ea580c; }
  .kpi.purple .kpi-value { color: #7c3aed; }

  .section { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
  .section-title { font-size: 14px; font-weight: 700; color: #374151; margin-bottom: 14px; }
  .section-title .badge { font-size: 11px; padding: 2px 8px; border-radius: 6px; margin-right: 8px; background: #ede9fe; color: #7c3aed; }

  table { width: 100%; border-collapse: collapse; }
  th { font-size: 11px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; padding: 8px 10px; text-align: right; border-bottom: 2px solid #e5e7eb; font-weight: 600; }
  td { padding: 9px 10px; font-size: 13px; border-bottom: 1px solid #f3f4f6; color: #374151; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f9fafb; }

  .gauge-wrap { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
  .gauge { width: 100%; max-width: 400px; height: 10px; background: #e5e7eb; border-radius: 5px; overflow: hidden; position: relative; }
  .gauge-fill { height: 100%; border-radius: 5px; }
  .gauge-mark { position: absolute; top: -2px; width: 2px; height: 14px; background: #9ca3af; }
  .gauge-label { font-size: 12px; color: #6b7280; margin-top: 8px; }

  .note { font-size: 13px; color: #6b7280; padding: 12px; background: #fef3c7; border: 1px solid #fde68a; border-radius: 8px; margin-top: 14px; }
  .note.blue { background: #dbeafe; border-color: #93c5fd; color: #1e40af; }

  jun: { sales: 901022, food: 161161, foodPct: 17.9, labor: 167946, laborPct: 18.6, prime: 36.5, workers: JUN_WORKERS, items: JUN_ITEMS, workerCount: 20, workerHours: '2,911', period: 'יוני 2026 (חודש מלא)', itemTotal: 94, itemQty: '115,000+' },
  jul: { sales: 438814, food: 79465, foodPct: 18.1, labor: 180171, laborPct: 41.1, prime: 59.2, workers: JUL_WORKERS, items: JUL_ITEMS, workerCount: 20, workerHours: '3,156', period: 'יולי 2026 (חודש מלא)', itemTotal: 94, itemQty: '56,832' },
  aug: { sales: 60437, food: 11529, foodPct: 19.1, labor: 52850, laborPct: 87.4, prime: 106.5, workers: AUG_WORKERS, items: AUG_ITEMS, workerCount: 19, workerHours: '376.5', period: 'אוגוסט 2026 MTD (5 ימים)', itemTotal: 80, itemQty: '8,494' }
};

function render(month) {
  var d = MONTHS[month];
  var profit = d.sales - d.food - d.labor;
  var profitPct = Math.round(profit / d.sales * 1000) / 10;
  var pc = pctClass(d.prime);
  var gc = pc==='green'?'#059669':pc==='yellow'?'#d97706':'#dc2626';
  var isMTD = month === 'aug';
  var isJul = month === 'jul';

  var h = '';

  // KPIs
  h += '<div class="kpi-grid">';
  h += '<div class="kpi"><div class="kpi-label">מכירות (MarketMan — נטו)</div><div class="kpi-value">'+fmt(d.sales)+'</div><div class="kpi-sub">'+d.itemTotal+' פריטים | '+d.itemQty+' יחידות</div></div>';
  h += '<div class="kpi green"><div class="kpi-label">עלות מזון (MarketMan)</div><div class="kpi-value">'+fmt(d.food)+'</div><div class="kpi-sub">'+d.foodPct+'% ממכירות נטו</div></div>';
  h += '<div class="kpi orange"><div class="kpi-label">עלות שכר (ShiftOrganizer)</div><div class="kpi-value">'+fmt(d.labor)+'</div><div class="kpi-sub">'+d.laborPct+'% ממכירות נטו | '+d.workerCount+' עובדים | '+d.workerHours+'שעה</div></div>';
  h += '<div class="kpi '+pc+'"><div class="kpi-label">Prime Cost (שכר + מזון)</div><div class="kpi-value">'+d.prime+'%</div><div class="kpi-sub">יעד: ≤60% '+(pc==='green'?'✅ ירוק':pc==='yellow'?'⚠️ צהוב':'🔴 אדום')+'</div></div>';
  h += '<div class="kpi '+(profit>0?'green':'red')+'"><div class="kpi-label">רווח תפעולי</div><div class="kpi-value">'+(profit<0?fmtNeg(profit):fmt(profit))+'</div><div class="kpi-sub">'+profitPct+'% ממכירות נטו</div></div>';
  h += '</div>';

  if (isMTD) {
    h += '<div class="note blue">📊 <b>אוגוסט MTD — 5 ימים בלבד.</b> אחוזי השכר מנופחים כי 3 עובדים עם שכר חודשי קבוע (₪12,000 כל אחד) מופיעים במלואם גם ב-MTD.</div>';
  }

  // Prime cost gauge
  h += '<div class="section"><div class="section-title">Prime Cost — שכר + מזון (% ממכירות נטו) — '+d.period+'</div><div class="gauge-wrap">';
  h += '<div class="gauge"><div class="gauge-fill" style="width:'+Math.min(d.prime/80*100,100)+'%;background:'+gc+'"></div><div class="gauge-mark" style="left:60%"></div><div class="gauge-mark" style="left:75%"></div></div>';
  h += '<div style="font-size:24px;font-weight:800;color:'+gc+'">'+d.prime+'%</div></div>';
  h += '<div class="gauge-label">שכר: '+d.laborPct+'% + מזון: '+d.foodPct+'% = '+d.prime+'% | יעד: ≤60% (ירוק) | 60-75% (צהוב) | >75% (אדום)</div></div>';

  // Variance report (July only)
  if (isJul) {
    h += '<div class="section" style="border-color:#ddd6fe"><div class="section-title">דוח פער מלאי — MarketMan Actual vs. Theoretical <span class="badge">'+VARIANCE.period+'</span></div>';
    h += '<div class="kpi-grid" style="margin-bottom:16px">';
    h += '<div class="kpi red"><div class="kpi-label">פער מלאי (Variance Value)</div><div class="kpi-value">'+fmtNeg(VARIANCE.varianceValue)+'</div><div class="kpi-sub">'+VARIANCE.variancePct+'% ממכירות</div></div>';
    h += '<div class="kpi red"><div class="kpi-label">פער ללא בזבוז</div><div class="kpi-value">'+fmtNeg(VARIANCE.varianceExclWaste)+'</div><div class="kpi-sub">'+VARIANCE.varianceExclWastePct+'% ממכירות</div></div>';
    h += '<div class="kpi"><div class="kpi-label">עלות שימוש בפועל</div><div class="kpi-value">'+fmt(VARIANCE.actualUsage)+'</div><div class="kpi-sub">Actual | '+VARIANCE.actualGrossProfitPct+'% רווח גולמי</div></div>';
    h += '<div class="kpi purple"><div class="kpi-label">עלות תיאורטית</div><div class="kpi-value">'+fmt(VARIANCE.theoreticalUsage)+'</div><div class="kpi-sub">Theoretical | '+VARIANCE.theoreticalGrossProfitPct+'% רווח גולמי</div></div>';
    h += '<div class="kpi"><div class="kpi-label">מכירות (לפי פער מלאי)</div><div class="kpi-value">'+fmt(VARIANCE.totalSales)+'</div><div class="kpi-sub">'+VARIANCE.totalItems+' פריטים נספרו</div></div>';
    h += '</div>';
    h += '<div style="display:flex;gap:24px;margin-bottom:16px;flex-wrap:wrap">';
    h += '<div style="flex:1;min-width:240px"><div style="font-size:11px;color:#9ca3af;margin-bottom:4px">רווח גולמי בפועל</div><div style="font-size:22px;font-weight:800;color:#059669">'+fmt(VARIANCE.actualGrossProfit)+'</div><div style="font-size:12px;color:#6b7280">'+VARIANCE.actualGrossProfitPct+'% ממכירות</div></div>';
    h += '<div style="flex:1;min-width:240px"><div style="font-size:11px;color:#9ca3af;margin-bottom:4px">רווח גולמי תיאורטי</div><div style="font-size:22px;font-weight:800;color:#7c3aed">'+fmt(VARIANCE.theoreticalGrossProfit)+'</div><div style="font-size:12px;color:#6b7280">'+VARIANCE.theoreticalGrossProfitPct+'% ממכירות</div></div>';
    h += '<div style="flex:1;min-width:240px"><div style="font-size:11px;color:#9ca3af;margin-bottom:4px">הפרש רווח</div><div style="font-size:22px;font-weight:800;color:#dc2626">'+fmtNeg(VARIANCE.actualGrossProfit - VARIANCE.theoreticalGrossProfit)+'</div><div style="font-size:12px;color:#6b7280">'+VARIANCE.grossProfitVariance+'% פער</div></div>';
    h += '</div>';
    h += '<table><thead><tr><th>#</th><th>קטגוריה</th><th>פריט מלאי</th><th>יחידה</th><th>כמות</th><th>עלות בפועל</th><th>עלות תיאורטית</th><th>פער ערך</th><th>%</th></tr></thead><tbody>';
    VARIANCE_ITEMS.forEach(function(item,i){
      var vc = varColor(item.var);
      h += '<tr><td>'+(i+1)+'</td><td style="font-size:11px;color:#9ca3af">'+item.cat+'</td><td>'+item.name+'</td><td style="font-size:11px;color:#9ca3af">'+item.uom+'</td><td>'+item.qty+'</td><td>'+fmt(item.actual)+'</td><td style="color:#7c3aed">'+(item.theo>0?fmt(item.theo):'—')+'</td><td style="font-weight:700;color:'+vc+'">'+fmtNeg(item.var)+'</td><td style="color:'+vc+'">'+(item.varPct>0?'+':'')+item.varPct+'%</td></tr>';
    });
    h += '</tbody></table>';
    h += '<div class="note">⚠️ רוב הפריטים מציגים פער של ~100% כי המתכונים בMarketMan לא מוגדרים. הפער הכולל של ₪32,374 מייצג חוסר תיאום בין המלאי בפועל לתיאורטי.</div>';
    h += '</div>';
  }

  // Workers
  h += '<div class="section"><div class="section-title">עובדים — ShiftOrganizer ('+d.workerCount+' עובדים) — '+d.period+'</div>';
  h += '<table><thead><tr><th>#</th><th>עובד</th><th>תפקיד</th><th>שעות</th><th>עלות מעסיק</th><th>₪/שעה</th></tr></thead><tbody>';
  d.workers.forEach(function(w,i){
    var rate = w.hours>0 ? Math.round(w.cost/w.hours) : 0;
    h += '<tr><td>'+(i+1)+'</td><td>'+w.name+'</td><td>'+w.role+'</td><td>'+w.hours+'</td><td style="font-weight:700">'+fmt(w.cost)+'</td><td>'+(rate>0?fmt(rate):'—')+'</td></tr>';
  });
  h += '<tr style="background:#f9fafb"><td colspan="3" style="font-weight:700">סה"כ</td><td style="font-weight:700">'+d.workerHours+'</td><td style="font-weight:700">'+fmt(d.labor)+'</td><td></td></tr>';
  h += '</tbody></table></div>';

  // Top items
  h += '<div class="section"><div class="section-title">מנות מובילות — דוח רווחיות מנות (MarketMan) — '+d.period+'</div>';
  h += '<table><thead><tr><th>#</th><th>פריט</th><th>כמות</th><th>מכירות</th><th>עלות מזון</th><th>רווח ליחידה</th><th>רווח כולל</th></tr></thead><tbody>';
  d.items.forEach(function(item,i){
    h += '<tr><td>'+(i+1)+'</td><td>'+item.name+'</td><td>'+item.qty.toLocaleString('he-IL')+'</td><td>'+fmt(item.sales)+'</td><td>'+fmt(item.fc)+'</td><td>'+fmt(item.profit_per)+'</td><td style="font-weight:700;color:#059669">'+fmt(item.profit)+'</td></tr>';
  });
  h += '</tbody></table></div>';

  // P&L summary
  h += '<div class="section"><div class="section-title">סיכום פיננסי — '+d.period+'</div><table><tbody>';
  h += '<tr><td>מכירות (נטו)</td><td style="font-weight:700">'+fmt(d.sales)+'</td></tr>';
  h += '<tr><td>עלות מזון</td><td style="color:#dc2626">-'+fmt(d.food)+'</td><td>'+d.foodPct+'%</td></tr>';
  h += '<tr><td>עלות שכר</td><td style="color:#dc2626">-'+fmt(d.labor)+'</td><td>'+d.laborPct+'%</td></tr>';
  if (isJul) {
    h += '<tr><td>פער מלאי</td><td style="color:#dc2626">'+fmtNeg(VARIANCE.varianceValue)+'</td><td>'+VARIANCE.variancePct+'%</td></tr>';
  }
  h += '<tr style="background:#f0fdf4"><td style="font-weight:700">רווח תפעולי</td><td style="font-weight:700;color:'+(profit>0?'#059669':'#dc2626')+'">'+(profit<0?fmtNeg(profit):fmt(profit))+'</td><td>'+profitPct+'%</td></tr>';
  h += '</tbody></table></div>';

  document.getElementById('content').innerHTML = h;
}

function switchMonth(m, btn) {
  document.querySelectorAll('.toggle-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  render(m);
}

render('jul');
</script>

</body>
</html>
