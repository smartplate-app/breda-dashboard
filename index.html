.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }

.kpi-sub { font-size: 12px; color: #6b7280; margin-top: 4px; }
.kpi.green .kpi-value { color: #059669; }
.kpi.blue .kpi-value { color: #2563eb; }
.kpi.purple .kpi-value { color: #7c3aed; }

.section { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
.section-title { font-size: 15px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.badge { font-size: 11px; padding: 2px 10px; border-radius: 20px; font-weight: 600; }
.badge.star { background: #dbeafe; color: #1e40af; }

table { width: 100%; border-collapse: collapse; }
th { font-size: 11px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; padding: 8px 10px; text-align: right; border-bottom: 2px solid #e5e7eb; font-weight: 600; }
td { padding: 9px 10px; font-size: 13px; border-bottom: 1px solid #f3f4f6; color: #374151; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #f9fafb; }
.fc-bar { display: inline-block; width: 40px; height: 6px; background: #e5e7eb; border-radius: 3px; margin-left: 6px; vertical-align: middle; }
.fc-bar-fill { height: 100%; border-radius: 3px; }
